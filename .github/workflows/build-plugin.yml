name: Releases

on:
  push:
    tags:
    - 'v*'
  # Manual run for an existing tag: rebuilds the ZIP and (re-)attaches it to the
  # release, e.g. after a failed run. An existing release keeps its title and notes.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.5.5)'
        required: true
        type: string

jobs:
  build:
    name: Build and Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history and tags, so the previous tag can be resolved for the compare link
          fetch-depth: 0

      - name: Extract version from plugin file
        id: get_version
        run: |
          VERSION=$(grep -oP "Version:\s+\K[0-9.]+" churchtools-wpcalendarsync.php)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

          # The ZIP name and the release notes are derived from the plugin version,
          # so a tag that does not match it would publish a mislabelled release.
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the plugin version '$VERSION' (expected tag 'v$VERSION')."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        id: get_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # CHANGELOG.md is a list of "## <date>" sections; the one for this release is
          # the section containing a "- Release v<version>" marker line. That marker is
          # dropped from the notes (it is redundant on the release page). The file is
          # stored with CRLF, so strip CR before matching.
          tr -d '\r' < CHANGELOG.md | awk -v ver="$VERSION" '
            function flush() {
              if (hit) { printf "%s", buf; done = 1; exit 0 }
              buf = ""; hit = 0
            }
            /^## / { if (started) flush(); started = 1; buf = ""; hit = 0; next }
            started {
              if ($0 == ("- Release v" ver)) { hit = 1; next }
              buf = buf $0 "\n"
            }
            END { if (started && !done) flush() }
          ' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No '- Release v$VERSION' section found in CHANGELOG.md; publishing minimal notes."
            printf 'Release %s\n' "$VERSION" > release-notes.md
          fi

          # Append a compare link against the previous tag, when there is one
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -1)
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full changelog:** %s/%s/compare/%s...v%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREV_TAG" "$VERSION" >> release-notes.md
          fi

          echo "----- release notes -----"
          cat release-notes.md
          echo "-------------------------"

      - name: Build project
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Create plugin folder structure
        run: |
          PLUGIN_FOLDER="churchtools-wp-sync"
          mkdir -p build/$PLUGIN_FOLDER

          # Copy all files except .git and build directory into the plugin folder
          # Development-only files (tests, IDE config, logs) are excluded from the release
          rsync -av --exclude='.git' --exclude='build' --exclude='.github' \
                --exclude='tests' --exclude='.idea' --exclude='.gitignore' \
                --exclude='release-notes.md' \
                --exclude='*.log' . build/$PLUGIN_FOLDER/

          # Create zip from the build directory (so the plugin folder is at the root of the zip)
          cd build
          zip -r churchtools-wp-sync-${{ steps.get_version.outputs.version }}.zip $PLUGIN_FOLDER
          mv churchtools-wp-sync-${{ steps.get_version.outputs.version }}.zip ../
          cd ..

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          ZIP="churchtools-wp-sync-$VERSION.zip"

          # The GitHub API occasionally answers 5xx / "Not Found" for a short while
          # (this failed the v1.5.5 release), so every call is retried with a
          # growing pause: 5 attempts, 15/30/45/60 s apart.
          retry() {
            attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::'$*' still failing after $attempt attempts"
                return 1
              fi
              echo "::warning::'$*' failed (attempt $attempt), retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          # Create the release unless it already exists. The check is repeated on
          # every attempt because a failed create call can still have created it.
          # An existing release keeps its (possibly hand-edited) title and notes.
          ensure_release() {
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release $TAG exists"
              return 0
            fi
            gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file release-notes.md
          }

          retry ensure_release
          retry gh release upload "$TAG" "$ZIP" --clobber
